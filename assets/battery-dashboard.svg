<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Battery dispatch dashboard</title>
  <desc id="desc">A dashboard with battery inputs, charge and discharge schedules, state of energy, price analysis, and forecast charts.</desc>
  <rect width="1200" height="700" fill="#fff"/>
  <rect width="185" height="700" fill="#f0f2f6"/>
  <g font-family="Arial,sans-serif" fill="#2d313b">
    <text x="18" y="64" font-size="20" font-weight="700">Model Inputs</text>
    <text x="18" y="102" font-size="12">Battery power (MW)</text>
    <rect x="18" y="116" width="150" height="36" rx="8" fill="#fff"/>
    <text x="31" y="139" font-size="13">5</text>
    <text x="18" y="184" font-size="12">Battery capacity (hours)</text>
    <rect x="18" y="198" width="150" height="36" rx="8" fill="#fff"/>
    <text x="31" y="221" font-size="13">2</text>
    <text x="18" y="266" font-size="12">Max cycles</text>
    <rect x="18" y="280" width="150" height="36" rx="8" fill="#fff"/>
    <text x="31" y="303" font-size="13">2</text>

    <text x="236" y="48" font-size="12">Power (MW)</text>
    <text x="236" y="84" font-size="28">5.0</text>
    <text x="475" y="48" font-size="12">Profit (£)</text>
    <text x="475" y="84" font-size="28">692</text>
    <text x="714" y="48" font-size="12">Normalized Profit (£/MW)</text>
    <text x="714" y="84" font-size="28">138</text>
    <text x="953" y="48" font-size="12">Captured Price Spread</text>
    <text x="953" y="84" font-size="28">34.6</text>

    <text x="238" y="145" font-size="15" font-weight="700">Charge / Discharge Schedule</text>
    <text x="704" y="145" font-size="15" font-weight="700">State of Energy</text>
    <text x="238" y="435" font-size="15" font-weight="700">Historical Price vs Residual Load</text>
    <text x="704" y="435" font-size="15" font-weight="700">Intraday Forecast Inputs</text>
  </g>

  <g stroke="#e2e6ee" stroke-width="1">
    <path d="M270 190H624M270 235H624M270 280H624M270 325H624"/>
    <path d="M735 190H1138M735 235H1138M735 280H1138M735 325H1138"/>
    <path d="M270 480H624M270 530H624M270 580H624M270 630H624"/>
    <path d="M735 480H1138M735 530H1138M735 580H1138M735 630H1138"/>
  </g>

