    <rect x="365" y="200" width="9" height="80"/><rect x="378" y="200" width="9" height="80"/>
    <rect x="391" y="200" width="9" height="80"/><rect x="404" y="200" width="9" height="80"/>
    <rect x="527" y="200" width="9" height="80"/><rect x="540" y="200" width="9" height="80"/>
    <rect x="553" y="200" width="9" height="80"/><rect x="566" y="200" width="9" height="80"/>
  </g>
  <g fill="#c76161">
    <rect x="316" y="280" width="9" height="66"/><rect x="329" y="280" width="9" height="66"/>
    <rect x="342" y="280" width="9" height="66"/><rect x="355" y="280" width="9" height="66"/>
    <rect x="478" y="280" width="9" height="66"/><rect x="491" y="280" width="9" height="66"/>
    <rect x="504" y="280" width="9" height="66"/><rect x="517" y="280" width="9" height="66"/>
