<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">UK storage portfolio decision maps</title>
  <desc id="desc">Six maps show offshore reservoirs selected under energy-delivery targets from 5 to 200 terawatt-hours.</desc>
  <rect width="900" height="760" fill="#fff"/>
  <defs>
