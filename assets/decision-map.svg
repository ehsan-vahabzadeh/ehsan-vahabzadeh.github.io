      <path d="M78 0c-7 22 1 43-14 56s-4 33 13 39" fill="none" stroke="#777"/>
      <path d="M130 0v188M220 0v188M310 0v188M0 62h420M0 124h420" stroke="#c9d5e4" stroke-width=".6"/>
      <g fill="#a8adb5" opacity=".65">
