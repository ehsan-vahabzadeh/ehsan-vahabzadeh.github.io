  <g transform="translate(20 250)"><use href="#panel"/><g fill="#f29a3a" stroke="#111" stroke-width="2"><circle cx="286" cy="92" r="18"/><circle cx="326" cy="130" r="16"/><circle cx="354" cy="136" r="22"/><circle cx="380" cy="74" r="13"/></g></g>
  <g transform="translate(460 250)"><use href="#panel"/><g fill="#8655ad" stroke="#111" stroke-width="2"><circle cx="282" cy="112" r="20"/><circle cx="330" cy="136" r="17"/><circle cx="353" cy="130" r="22"/><circle cx="382" cy="148" r="15"/></g></g>
