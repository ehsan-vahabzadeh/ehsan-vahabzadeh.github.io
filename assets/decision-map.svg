        <circle cx="316" cy="97" r="2"/><circle cx="330" cy="109" r="2"/><circle cx="347" cy="124" r="2"/>
        <circle cx="363" cy="141" r="2"/><circle cx="380" cy="154" r="2"/><circle cx="396" cy="168" r="2"/>
      </g>
    </g>
